# index.html 은 매번 서버에 재검증하게 하고, 파일명에 해시가 붙은 에셋만 오래 캐시한다.
# Cache-Control 이 없으면 브라우저가 Last-Modified 기준 휴리스틱 캐시로 옛 index.html(=옛 번들 해시)을
# 몇 시간씩 재사용해서, 새로 배포해도 관리자 웹이 옛 코드로 뜬다
map $uri $admin_cache_control {
    ~^/admin/assets/   "public, max-age=31536000, immutable";
    default            "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 리다이렉트를 상대 경로로 보낸다. 켜 두면 nginx 가 $host 로 절대 URL 을 만드는데
    # 포트(3000)나 ALB 앞단을 모르기 때문에 엉뚱한 주소로 튄다
    absolute_redirect off;

    # ALB 한 대를 백엔드와 나눠 쓴다. 루트(/)와 /api, /ws 는 백엔드로 가고
    # 관리자 웹은 /admin 아래에서만 서비스된다 (vite base 도 '/admin/').
    # ALB(AWS Load Balancer Controller)는 nginx 같은 경로 rewrite 를 못 해서,
    # 들어온 경로 그대로 여기서 받아야 한다.
    location = /admin {
        return 301 /admin/;
    }

    # 에셋까지 이 한 블록이 다 처리한다.
    # 정규식 location 에 alias 를 쓰면 경로가 안 맞아 404 가 난다 — 접두사 location 하나로 둔다.
    # 캐시 정책은 파일 맨 위 map 이 정한다. try_files 가 index.html 로 넘기면 $uri 도 바뀌어 no-cache 가 붙는다
    location /admin/ {
        alias /usr/share/nginx/html/;
        add_header Cache-Control $admin_cache_control;
        try_files $uri $uri/ /admin/index.html;
    }

    # ALB 대상 그룹 헬스체크용. /admin 을 치면 SPA 전체를 내려주게 되니 가벼운 경로를 따로 둔다
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 로컬 도커(compose)에서는 ALB 없이 3000 포트로 바로 붙는다. 루트로 와도 /admin 으로 보낸다
    location = / {
        return 302 /admin/;
    }
}
